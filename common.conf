# ─────────────────────────────────────────────────────────────────────────────
# common.conf — shared configuration for the legacy Overleaf 6.2.0 → new
# 6.3.1 (ext-ce) + SeaweedFS/S3 stack migration tools (fs → S3 data plane).
#
# All tools are run from the new stack's compose dir parent, i.e.:
#   /data_1/docker/compose/migration/*.sh
#
# Everything here can be overridden by exporting the same variable name
# before calling a tool (env wins over this file).
# ─────────────────────────────────────────────────────────────────────────────

# ─── Source: legacy 6.2.0 backup (copied from the old server) ────────────────
LEGACY_ROOT="${LEGACY_ROOT:-/root/other_server/compose_cep}"
LEGACY_SERVER_DATA="${LEGACY_SERVER_DATA:-${LEGACY_ROOT}/overleafserver/data}"   # the host dir bind-mounted as /var/lib/overleaf (contains user_files/… via ./data mount → data subdir)

# ─── Target: new stack (this machine) ────────────────────────────────────────
TARGET_COMPOSE_DIR="${TARGET_COMPOSE_DIR:-/data_1/docker/compose}"
TARGET_OVERLEAF_CONTAINER="${TARGET_OVERLEAF_CONTAINER:-overleaf}"
TARGET_SEAWEEDFS_S3_CONTAINER="${TARGET_SEAWEEDFS_S3_CONTAINER:-seaweedfs-s3}"

# ─── S3 plane ────────────────────────────────────────────────────────────────
# Endpoint reachable from the HOST (seaweedfs-s3 publishes 8333).
S3_ENDPOINT="${S3_ENDPOINT:-http://127.0.0.1:8333}"
# Bucket names — keep identical to the overleaf/compose.yaml in the target stack.
S3_USER_FILES_BUCKET="${S3_USER_FILES_BUCKET:-overleaf-user-files}"
S3_TEMPLATE_FILES_BUCKET="${S3_TEMPLATE_FILES_BUCKET:-overleaf-template-files}"
S3_PROJECT_BLOBS_BUCKET="${S3_PROJECT_BLOBS_BUCKET:-overleaf-project-blobs}"
S3_CHUNKS_BUCKET="${S3_CHUNKS_BUCKET:-overleaf-chunks}"

die() { echo "ERROR: $*" >&2; exit 1; }
log() { echo "[migration] $*"; }

require_cmd() { command -v "$1" >/dev/null 2>&1 || die "required command not found: $1"; }

require_container() {
  docker inspect "$1" >/dev/null 2>&1 || die "container not found: $1 (is the target stack up? 'cd ${TARGET_COMPOSE_DIR} && docker compose up -d')"
}

container_healthy() {
  local c; c=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$1" 2>/dev/null)
  [ "$c" = "healthy" ] || [ "$c" = "none" ]
}

# Load AWS credentials + shared config from the target .env (never hardcode
# keys in tools).
load_target_env() {
  [ -f "${TARGET_COMPOSE_DIR}/.env" ] || die "target .env not found: ${TARGET_COMPOSE_DIR}/.env"
  set -a
  # shellcheck disable=SC1091
  source "${TARGET_COMPOSE_DIR}/.env"
  set +a
}
